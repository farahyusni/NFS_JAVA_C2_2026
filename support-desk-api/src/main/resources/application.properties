############################################################
# Application Configuration
############################################################

# Name of this Spring Boot application
spring.application.name=support-desk-api

############################################################
# MongoDB Configuration
############################################################

spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DATABASE:support_desk_db}
spring.mongodb.username=${MONGO_USERNAME:app_user}
spring.mongodb.password=${MONGO_PASSWORD:abc123}
spring.mongodb.authentication-database=${MONGO_AUTH_DATABASE:support_desk_db}

############################################################
# Development Settings
############################################################

# Automatically create indexes defined in the model.
# This is useful during development.
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.boot.context.properties=TRACE

# Day 9 JWT settings (classroom/demo use only)
app.jwt.secret=${JWT_SECRET:day9-support-desk-demo-secret-key-change-me-min-32-chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
