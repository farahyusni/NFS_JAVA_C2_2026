############################################################
# Application Configuration
############################################################

# Name of this Spring Boot application
spring.application.name=support-desk-api

############################################################
# MongoDB Configuration
############################################################

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=support_desk_db
spring.data.mongodb.username=app_user
spring.data.mongodb.password=abc123
spring.data.mongodb.authentication-database=support_desk_db

spring.data.mongodb.auto-index-creation=true

############################################################
# Development Settings
############################################################

# Automatically create indexes defined in the model.
# This is useful during development.
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.boot.context.properties=TRACE